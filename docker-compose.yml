services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/
      SECRET_KEY: ${SECRET_KEY:-dev-only-not-secret}
      ACHECKER_TIMEOUT: ${ACHECKER_TIMEOUT:-300}
      ACHECKER_TZ: ${ACHECKER_TZ:-Europe/Berlin}
    depends_on:
      - mongo
    volumes:
      - uploads:/app/uploads

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  uploads:
  mongo-data:
