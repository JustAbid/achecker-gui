<!DOCTYPE html>
<html lang="en" class="light-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Web interface for AChecker, a static analyzer for smart-contract access-control vulnerabilities.">
    <title>{% block title %}AChecker GUI{% endblock %}</title>
    <link rel="stylesheet" href="{{ static_url('css/styles.css') }}">
    <script>
        // set the theme before the page paints so dark mode doesn't flash white
        (function () {
            try {
                var mode = localStorage.getItem('mode');
                if (mode === 'dark-mode' || mode === 'light-mode') {
                    document.documentElement.className = mode;
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <header>
        <h1>{% block heading %}AChecker{% endblock %}</h1>
        <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
                <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-7.54-7.54c-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true" hidden>
                <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 2 3h-4l2-3zm0 20-2-3h4l-2 3zM2 12l3-2v4l-3-2zm20 0-3 2v-4l3 2zM5 5l3 1-2 2-1-3zm14 14-3-1 2-2 1 3zM5 19l1-3 2 2-3 1zM19 5l-1 3-2-2 3-1z"/>
            </svg>
        </button>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{{ static_url('js/scripts.js') }}"></script>
</body>
</html>
