<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Files</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="light-mode">
    <header>
        <h1>Uploaded Files</h1>
        <div class="theme-switch">
            <img id="theme-toggle" src="https://img.icons8.com/fluency/48/moon-symbol.png" alt="Toggle Theme">
        </div>
    </header>
    <main>
        <div class="file-list">
            <h2>Files:</h2>
            <table class="file-table">
                <thead>
                    <tr>
                        <th>Filename</th>
                        <th>Upload Time</th>
                    </tr>
                </thead>
                <tbody>
                    {% for file in files %}
                    <tr>
                        <td>{{ file['filename'] }}</td>
                        <td>{{ file['upload_time'] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="back-button">
            <button onclick="window.location.href='{{ url_for('index') }}'" class="comic-button">Back to Home</button>
        </div>
    </main>
    <script src="/static/js/scripts.js"></script>
</body>
</html>
